<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>rubber-duck · agents internals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0d0f12; color: #e6e8eb; padding: 2rem; min-height: 100vh;
  }
  h1 { font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; color: #8b949e; }
  .bar { display: flex; gap: 0.75rem; align-items: center; margin: 1.25rem 0 2rem; }
  input {
    background: #161b22; border: 1px solid #30363d; color: #e6e8eb;
    padding: 0.5rem 0.75rem; border-radius: 6px; font: inherit; width: 12rem;
  }
  button {
    background: #238636; border: 0; color: white; padding: 0.5rem 1rem;
    border-radius: 6px; font: inherit; cursor: pointer;
  }
  button:disabled { background: #30363d; cursor: default; }
  .status { font-size: 0.75rem; color: #8b949e; }
  .status.on { color: #3fb950; }

  .pipeline { display: flex; align-items: stretch; gap: 0.5rem; flex-wrap: wrap; }
  .stage {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 0.9rem 1rem; min-width: 10rem; flex: 1;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .stage h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: #8b949e; margin-bottom: 0.5rem; }
  .stage .big { font-size: 1.6rem; font-weight: 700; }
  .stage .sub { font-size: 0.7rem; color: #8b949e; margin-top: 0.25rem; }
  .stage.flash { border-color: #3fb950; box-shadow: 0 0 0 1px #3fb950; }
  .arrow { align-self: center; color: #30363d; font-size: 1.2rem; }

  .agents { display: flex; flex-direction: column; gap: 0.4rem; }
  .agent { display: flex; justify-content: space-between; font-size: 0.8rem; }
  .agent .n { color: #8b949e; }
  .agent.dim { opacity: 0.35; }

  .threads { margin-top: 2rem; }
  .threads h2, .log h2 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em;
    color: #8b949e; margin-bottom: 0.6rem;
  }
  .chip {
    display: inline-block; margin: 0 0.4rem 0.4rem 0; padding: 0.3rem 0.7rem;
    border-radius: 999px; font-size: 0.75rem; border: 1px solid #30363d;
  }
  .chip.settled { border-color: #3fb950; color: #3fb950; }
  .chip.ongoing { border-color: #d29922; color: #d29922; }

  .log { margin-top: 2rem; }
  .log ul { list-style: none; max-height: 20rem; overflow-y: auto; }
  .log li {
    font-size: 0.75rem; padding: 0.3rem 0; border-bottom: 1px solid #161b22;
    color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .log li b { color: #e6e8eb; }
  .log li.noise b { color: #f85149; }
  .log li.draw b { color: #3fb950; }
</style>
</head>
<body>
  <h1>rubber-duck · agents internals</h1>

  <div class="bar">
    <input id="session" placeholder="session id" />
    <button id="connect">Connect</button>
    <span class="status" id="status">disconnected</span>
  </div>

  <div class="pipeline">
    <div class="stage" id="st-ingest">
      <h2>Ingest</h2>
      <div class="big" id="c-ingest">0</div>
      <div class="sub">chunks received</div>
    </div>
    <div class="arrow">→</div>
    <div class="stage" id="st-filter">
      <h2>Noise filter</h2>
      <div class="big" id="c-noise">0</div>
      <div class="sub">dropped (jaja / fillers)</div>
    </div>
    <div class="arrow">→</div>
    <div class="stage" id="st-buffer">
      <h2>Buffer</h2>
      <div class="big" id="c-buffer">0</div>
      <div class="sub">chunks waiting</div>
    </div>
    <div class="arrow">→</div>
    <div class="stage" id="st-organizer">
      <h2>Organizer · LLM</h2>
      <div class="big" id="c-organized">0</div>
      <div class="sub">organize runs</div>
    </div>
    <div class="arrow">→</div>
    <div class="stage" id="st-agents">
      <h2>Dispatch</h2>
      <div class="agents">
        <div class="agent"><span class="n">architect</span><span id="c-architect">0</span></div>
        <div class="agent dim"><span class="n">critic</span><span>soon</span></div>
        <div class="agent dim"><span class="n">scribe</span><span>soon</span></div>
      </div>
    </div>
  </div>

  <div class="threads">
    <h2>Threads · last organize</h2>
    <div id="threads"><span class="sub" style="color:#30363d">nothing yet</span></div>
  </div>

  <div class="log">
    <h2>Event log</h2>
    <ul id="log"></ul>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let es = null;
  const counts = { ingest: 0, noise: 0, organized: 0, architect: 0 };

  const params = new URLSearchParams(location.search);
  if (params.get("session")) $("session").value = params.get("session");

  function flash(id) {
    const el = $(id);
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 400);
  }

  function log(kind, text) {
    const li = document.createElement("li");
    li.className = kind;
    const time = new Date().toLocaleTimeString();
    li.innerHTML = `<b>${kind}</b> · ${time} · ${text}`;
    $("log").prepend(li);
    while ($("log").children.length > 200) $("log").lastChild.remove();
  }

  function connect() {
    const id = $("session").value.trim();
    if (!id) return;
    if (es) es.close();
    es = new EventSource(`/events/${id}`);
    $("status").textContent = `connected · ${id}`;
    $("status").classList.add("on");
    history.replaceState(null, "", `?session=${id}`);

    es.onmessage = (msg) => {
      let p;
      try { p = JSON.parse(msg.data); } catch { return; }
      const c = p.content || {};

      if (p.event === "organizer.status") {
        counts.ingest++;
        $("c-ingest").textContent = counts.ingest;
        flash("st-ingest");

        if (c.stage === "noise_dropped") {
          counts.noise++;
          $("c-noise").textContent = counts.noise;
          flash("st-filter");
          log("noise", `dropped "${c.text}"`);
        } else if (c.stage === "buffered") {
          $("c-buffer").textContent = c.buffer;
          flash("st-buffer");
          log("buffer", `+1 "${c.text}" (${c.buffer} waiting)`);
        } else if (c.stage === "organized") {
          counts.organized++;
          $("c-organized").textContent = counts.organized;
          $("c-buffer").textContent = c.kept;
          flash("st-organizer");
          const threads = c.threads || [];
          $("threads").innerHTML = threads.length
            ? threads.map(t =>
                `<span class="chip ${t.settled ? "settled" : "ongoing"}">` +
                `${t.settled ? "●" : "○"} ${t.topic}</span>`).join("")
            : '<span class="sub" style="color:#30363d">all discarded</span>';
          log("organize", `${c.chunks} chunks → ` +
            threads.map(t => `${t.topic} [${t.settled ? "settled" : "ongoing"}]`).join(", "));
        }
      } else if (p.event === "architect.draw") {
        counts.architect += (c.nodes || []).length;
        $("c-architect").textContent = counts.architect;
        flash("st-agents");
        log("draw", (c.nodes || []).map(n => `"${n.topic || n.label}"`).join(", "));
      } else {
        log("event", p.event);
      }
    };

    es.onerror = () => {
      $("status").textContent = "reconnecting…";
      $("status").classList.remove("on");
    };
  }

  $("connect").addEventListener("click", connect);
  $("session").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
  if ($("session").value) connect();
</script>
</body>
</html>
