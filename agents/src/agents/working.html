<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>rubber-duck · agents internals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f12; --panel: #161b22; --line: #30363d;
    --fg: #e6e8eb; --dim: #8b949e;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff;
    --violet: #a371f7; --teal: #39c5bb;
  }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--bg); color: var(--fg); padding: 1.5rem 2rem 4rem;
    min-height: 100vh;
  }
  header.top { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 0.95rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
  .spacer { flex: 1; }
  select, button {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    padding: 0.45rem 0.7rem; border-radius: 6px; font: inherit; cursor: pointer;
  }
  button.primary { background: #238636; border-color: #238636; color: white; }
  .status { font-size: 0.75rem; color: var(--dim); }
  .status.on { color: var(--green); }

  .bar { display: flex; gap: 2rem; margin: 1.4rem 0 1.6rem; flex-wrap: wrap; }
  .stat .big { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
  .stat .sub {
    font-size: 0.63rem; color: var(--dim); margin-top: 0.15rem;
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .stat.slow .big { color: var(--red); }

  /* One column, newest on top. Every row is one moment in the pipeline, and
     the eye should be able to follow speech turning into a drawing. */
  .feed { border-left: 1px solid var(--line); padding-left: 1.1rem; }
  .row {
    position: relative; padding: 0.5rem 0 0.55rem;
    border-bottom: 1px solid #1b2027; line-height: 1.5;
  }
  .row::before {
    content: ""; position: absolute; left: -1.42rem; top: 0.95rem;
    width: 7px; height: 7px; border-radius: 50%; background: var(--line);
  }
  .row.heard::before { background: var(--blue); }
  .row.noise::before { background: #30363d; }
  .row.organizer::before { background: var(--amber); }
  .row.handoff::before { background: var(--violet); }
  .row.scribe::before { background: var(--teal); }
  .row.drew::before { background: var(--green); }
  .row.fresh { animation: pop 0.5s ease-out; }
  @keyframes pop { from { background: #1b222b; } to { background: transparent; } }

  .when {
    font-size: 0.66rem; color: #6e7681; letter-spacing: 0.04em;
    display: inline-block; width: 7.2rem;
  }
  .what {
    font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.12em;
    display: inline-block; width: 6.5rem;
  }
  .row.heard .what { color: var(--blue); }
  .row.noise .what { color: #6e7681; }
  .row.organizer .what { color: var(--amber); }
  .row.handoff .what { color: var(--violet); }
  .row.scribe .what { color: var(--teal); }
  .row.drew .what { color: var(--green); }
  .row.scribe .says b { color: var(--teal); }
  .row.handoff .says b { color: var(--violet); }
  .says div.idle { color: #4d5560; }
  .tag {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: #6e7681; margin-left: 0.4rem;
  }

  .body { font-size: 0.82rem; }
  .said { color: var(--fg); }
  .row.noise .body { color: #6e7681; text-decoration: line-through; }
  .who { color: var(--blue); font-weight: 700; }

  /* The organizer's own words, one line per point, the way it would say them
     out loud before handing the pile to somebody else. */
  .says { margin: 0.35rem 0 0 13.7rem; }
  .says div { font-size: 0.78rem; padding: 0.12rem 0; color: var(--fg); }
  .says b { color: var(--amber); font-weight: 700; }
  .gist { margin: 0.15rem 0 0 13.7rem; font-size: 0.72rem; color: var(--dim); }
  .lag { font-size: 0.66rem; color: var(--dim); margin-left: 0.5rem; }
  .lag.slow { color: var(--red); }
  .to { color: var(--violet); font-weight: 700; }
  .empty { color: #30363d; font-size: 0.75rem; }
</style>
</head>
<body>
  <header class="top">
    <h1>rubber-duck · agents internals</h1>
    <span class="spacer"></span>
    <select id="session">
      <option value="*">all sessions (live)</option>
    </select>
    <button id="reload">↻ sessions</button>
    <button class="primary" id="clear">Clear</button>
    <span class="status" id="status">connecting…</span>
  </header>

  <div class="bar">
    <div class="stat"><div class="big" id="c-heard">0</div><div class="sub">heard</div></div>
    <div class="stat"><div class="big" id="c-noise">0</div><div class="sub">ignored</div></div>
    <div class="stat"><div class="big" id="c-buffer">0</div><div class="sub">waiting</div></div>
    <div class="stat"><div class="big" id="c-rev">0</div><div class="sub">revisions</div></div>
    <div class="stat"><div class="big" id="c-nodes">0</div><div class="sub">on the board</div></div>
    <div class="stat" id="st-lag"><div class="big" id="c-lag">—</div><div class="sub">speech → board</div></div>
  </div>

  <div class="feed" id="feed"><span class="empty">waiting for speech…</span></div>

<script>
  const $ = (id) => document.getElementById(id);
  let es = null;
  const counts = { heard: 0, noise: 0, rev: 0, nodes: 0 };
  // The digest carries when its oldest line was spoken. The draw that follows
  // only carries a revision, so we look the moment back up by revision.
  const spokenAt = new Map();
  // Revisions that already put something on the board once.
  const drawn = new Set();

  const params = new URLSearchParams(location.search);
  // Which session we are meant to be watching, which is not the same as what
  // the select can offer yet.
  let wanted = params.get("session") || "*";

  const clock = (ms) => {
    const d = ms ? new Date(ms * 1000) : new Date();
    return d.toLocaleTimeString("es-AR", { hour12: false }) +
      "." + String(d.getMilliseconds()).padStart(3, "0");
  };

  const esc = (s) => String(s ?? "").replace(/[<>&]/g,
    (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]);

  // "Ignacio dice que El equipo…" reads wrong. Only these openers get lowered,
  // so a point that starts on a name keeps it: "…dice que Supabase alcanza".
  const OPENERS = new Set(["el", "la", "los", "las", "un", "una", "se", "hay",
    "cada", "no", "es", "está", "estan", "están", "para", "con", "por", "ya",
    "lo", "todo", "todos", "esto", "eso", "falta", "queda", "van", "va"]);
  function saying(text) {
    const [first] = String(text).split(" ");
    if (!first || !OPENERS.has(first.toLowerCase())) return text;
    return first.toLowerCase() + text.slice(first.length);
  }

  // "6 ideas, 1 decisión" — what an agent was actually handed, by type.
  const PLURAL = {
    idea: ["idea", "ideas"], decision: ["decisión", "decisiones"],
    pregunta: ["pregunta", "preguntas"], pendiente: ["pendiente", "pendientes"],
  };
  function tally(points) {
    const by = new Map();
    for (const pt of points) by.set(pt.kind, (by.get(pt.kind) || 0) + 1);
    return [...by].map(([k, n]) => {
      const [one, many] = PLURAL[k] || [k, k];
      return `${n} ${n === 1 ? one : many}`;
    }).join(", ") || "nada";
  }

  function row(kind, what, body, extra = "", at) {
    const feed = $("feed");
    const blank = feed.querySelector(".empty");
    if (blank) blank.remove();
    const el = document.createElement("div");
    el.className = `row ${kind} fresh`;
    el.innerHTML =
      `<span class="when">${clock(at)}</span>` +
      `<span class="what">${what}</span>` +
      `<span class="body">${body}</span>${extra}`;
    feed.prepend(el);
    setTimeout(() => el.classList.remove("fresh"), 500);
    while (feed.children.length > 200) feed.lastChild.remove();
    return el;
  }

  function showLag(seconds, first) {
    const slow = seconds > 3;
    // The headline number is the budget: how long until something appears.
    // The arrows land in a later draw of the same revision and would only
    // make the number look worse than what anybody actually waited for.
    if (first) {
      $("c-lag").textContent = seconds.toFixed(1) + "s";
      $("st-lag").classList.toggle("slow", slow);
    }
    return `<span class="lag${slow ? " slow" : ""}">${seconds.toFixed(1)}s desde que se dijo</span>`;
  }

  async function loadSessions() {
    try {
      const r = await fetch("/sessions");
      const { sessions } = await r.json();
      const sel = $("session");
      sel.innerHTML = '<option value="*">all sessions (live)</option>';
      // A session asked for by URL may not have said anything yet. Without
      // this the select falls back to nothing and watches an empty channel.
      if (wanted !== "*" && !sessions.includes(wanted)) sessions.unshift(wanted);
      for (const s of sessions) {
        const o = document.createElement("option");
        o.value = s; o.textContent = s;
        sel.appendChild(o);
      }
      sel.value = wanted;
    } catch {}
  }

  function connect() {
    const id = wanted;
    if (es) es.close();
    es = new EventSource(`/events/${encodeURIComponent(id)}`);
    history.replaceState(null, "", id === "*" ? location.pathname : `?session=${id}`);

    es.onopen = () => {
      $("status").textContent = id === "*" ? "live · all sessions" : `live · ${id}`;
      $("status").classList.add("on");
    };

    es.onmessage = (msg) => {
      let p;
      try { p = JSON.parse(msg.data); } catch { return; }
      const c = p.content || {};

      if (p.event === "ingest.received") {
        counts.heard++;
        $("c-heard").textContent = counts.heard;
        // The moment of capture is the mic's own clock, not ours.
        row("heard", "escucha",
          `<span class="who">${esc(c.author)}</span> <span class="said">${esc(c.text)}</span>`,
          "", c.ts);
        return;
      }

      if (p.event === "organizer.status") {
        if (c.stage === "noise_dropped") {
          counts.noise++;
          $("c-noise").textContent = counts.noise;
          row("noise", "ignora", esc(c.text));
        } else if (c.stage === "queued") {
          $("c-buffer").textContent = c.pending;
        }
        return;
      }

      if (p.event === "organizer.digest") {
        counts.rev++;
        $("c-rev").textContent = counts.rev;
        $("c-buffer").textContent = 0;
        if (c.spoken_at) spokenAt.set(c.revision, c.spoken_at);

        const points = c.points || [];
        const said = points.map((pt) =>
          `<div><b>${esc(pt.author || "alguien")}</b> dice que ${esc(saying(pt.text))}` +
          (pt.kind && pt.kind !== "idea" ? `<span class="tag">${esc(pt.kind)}</span>` : "") +
          `</div>`
        ).join("");
        const cost = c.took
          ? ` · modelo ${c.took.toFixed(1)}s sobre ${c.batch} ${c.batch === 1 ? "línea" : "líneas"}`
          : "";
        const el = row("organizer", "organiza",
          `rev ${c.revision} · ${points.length} ideas${cost}`);
        el.insertAdjacentHTML("beforeend",
          (c.summary ? `<div class="gist">${esc(c.summary)}</div>` : "") +
          `<div class="says">${said || "<div>todavía nada que valga la pena</div>"}</div>`);
        return;
      }

      if (p.event === "orchestrator.dispatch") {
        const routes = c.routes || {};
        const names = c.agents || [];
        const el = row("handoff", "le pasa a",
          names.map((a) => `<span class="to">${esc(a)}</span>`).join(", ") || "nadie");
        const detail = names.map((a) =>
          `<div><b>${esc(a)}</b> ${tally(routes[a] || [])}</div>`
        ).join("") + (c.idle || []).map((a) =>
          `<div class="idle">${esc(a)} · sin cambios</div>`
        ).join("");
        if (detail) el.insertAdjacentHTML("beforeend", `<div class="says">${detail}</div>`);
        return;
      }

      if (p.event === "scribe.patch") {
        const patch = c.patch || {};
        const lists = [
          ["decision", patch.decisions],
          ["pendiente", patch.openItems],
          ["pregunta", patch.openQuestions],
        ].filter(([, items]) => (items || []).length);
        if (!lists.length) return;
        const el = row("scribe", "anota", lists.map(([kind, items]) =>
          `${items.length} ${PLURAL[kind][items.length === 1 ? 0 : 1]}`).join(" · "));
        el.insertAdjacentHTML("beforeend", `<div class="says">` + lists.map(
          ([kind, items]) => items.map(
            (t) => `<div><b>${PLURAL[kind][0]}</b> ${esc(t)}</div>`).join("")
        ).join("") + `</div>`);
        return;
      }

      if (p.event === "architect.draw") {
        const nodes = (c.nodes || []).length;
        const edges = (c.edges || []).length;
        counts.nodes = nodes;
        $("c-nodes").textContent = nodes;
        const at = spokenAt.get(c.revision);
        const first = !drawn.has(c.revision);
        drawn.add(c.revision);
        const lag = at ? showLag(Date.now() / 1000 - at, first) : "";
        row("drew", "dibuja", `${nodes} nodos, ${edges} flechas`, lag);
        return;
      }
    };

    es.onerror = () => {
      $("status").textContent = "reconnecting…";
      $("status").classList.remove("on");
    };
  }

  $("session").addEventListener("change", () => {
    wanted = $("session").value;
    connect();
  });
  $("reload").addEventListener("click", loadSessions);
  $("clear").addEventListener("click", () => {
    for (const k in counts) counts[k] = 0;
    spokenAt.clear();
    drawn.clear();
    ["c-heard", "c-noise", "c-buffer", "c-rev", "c-nodes"]
      .forEach((id) => ($(id).textContent = "0"));
    $("c-lag").textContent = "—";
    $("st-lag").classList.remove("slow");
    $("feed").innerHTML = '<span class="empty">waiting for speech…</span>';
  });

  loadSessions().then(connect);
  setInterval(loadSessions, 10000);
</script>
</body>
</html>
